<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2f3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1e26;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="topFaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#363d4e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#272c38;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sideFaceGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1e26;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#141720;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e2330;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161a24;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00c8ff;stop-opacity:0" />
      <stop offset="30%" style="stop-color:#00c8ff;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#00c8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00c8ff;stop-opacity:0" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="#0a1628"/>

  <!-- Subtle grid background -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="480"/>
    <line x1="200" y1="0" x2="200" y2="480"/>
    <line x1="300" y1="0" x2="300" y2="480"/>
    <line x1="400" y1="0" x2="400" y2="480"/>
    <line x1="500" y1="0" x2="500" y2="480"/>
    <line x1="600" y1="0" x2="600" y2="480"/>
    <line x1="700" y1="0" x2="700" y2="480"/>
  </g>

  <!-- Device group with drop shadow -->
  <g filter="url(#dropShadow)">
    <!-- 3D isometric box -->
    <!-- Top face -->
    <polygon points="180,100 620,100 680,140 240,140" fill="url(#topFaceGrad)"/>
    <!-- Top face edge highlight -->
    <line x1="180" y1="100" x2="620" y2="100" stroke="#4a5266" stroke-width="1"/>
    <line x1="620" y1="100" x2="680" y2="140" stroke="#3a4155" stroke-width="1"/>
    <line x1="180" y1="100" x2="240" y2="140" stroke="#3a4155" stroke-width="1"/>

    <!-- Front face (main panel) -->
    <rect x="180" y="140" width="440" height="210" fill="url(#bodyGrad)" rx="0"/>
    <!-- Front face border -->
    <rect x="180" y="140" width="440" height="210" fill="none" stroke="#3a4155" stroke-width="1"/>

    <!-- Right side face -->
    <polygon points="620,100 680,140 680,350 620,350" fill="url(#sideFaceGrad)"/>
    <line x1="620" y1="350" x2="680" y2="350" stroke="#3a4155" stroke-width="1"/>
    <line x1="680" y1="140" x2="680" y2="350" stroke="#3a4155" stroke-width="1"/>

    <!-- Bottom connector strip -->
    <rect x="180" y="350" width="440" height="20" fill="#141720"/>
    <polygon points="620,350 680,350 680,370 620,370" fill="#101318"/>
  </g>

  <!-- Front panel inset -->
  <rect x="196" y="154" width="408" height="182" fill="url(#panelGrad)" rx="2"/>
  <rect x="196" y="154" width="408" height="182" fill="none" stroke="#2a3040" stroke-width="1" rx="2"/>

  <!-- Cyan accent line top of panel -->
  <rect x="196" y="154" width="408" height="2" fill="url(#accentLine)" opacity="0.9"/>

  <!-- Brand stripe left -->
  <rect x="196" y="154" width="3" height="182" fill="#00c8ff" opacity="0.7"/>

  <!-- SEALINK ELECTRICAL wordmark -->
  <text x="220" y="183" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="3" fill="#00c8ff" opacity="0.9">SEALINK ELECTRICAL</text>

  <!-- DABox large label -->
  <text x="218" y="228" font-family="'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="1" fill="#ffffff">DABox</text>
  <!-- DABox glow copy -->
  <text x="218" y="228" font-family="'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="1" fill="#00c8ff" opacity="0.15" filter="url(#softGlow)">DABox</text>

  <!-- Tagline -->
  <text x="219" y="248" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="400" letter-spacing="1.5" fill="#6a7a8a">DATA ACQUISITION SYSTEM  ·  v2.1</text>

  <!-- Divider line -->
  <line x1="218" y1="257" x2="490" y2="257" stroke="#2a3040" stroke-width="1"/>

  <!-- Status LEDs cluster -->
  <!-- PWR -->
  <circle cx="224" cy="275" r="4" fill="#00ff88" filter="url(#glow)" opacity="0.9"/>
  <text x="233" y="279" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" fill="#4a5a6a" letter-spacing="0.5">PWR</text>

  <!-- DATA -->
  <circle cx="263" cy="275" r="4" fill="#00c8ff" filter="url(#glow)" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <text x="272" y="279" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" fill="#4a5a6a" letter-spacing="0.5">DATA</text>

  <!-- SYN -->
  <circle cx="306" cy="275" r="4" fill="#00c8ff" filter="url(#glow)" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.1s" repeatCount="indefinite"/>
  </circle>
  <text x="315" y="279" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" fill="#4a5a6a" letter-spacing="0.5">SYN</text>

  <!-- ERR -->
  <circle cx="349" cy="275" r="4" fill="#2a3040" opacity="0.6"/>
  <text x="358" y="279" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" fill="#4a5a6a" letter-spacing="0.5">ERR</text>

  <!-- Port block right side of panel -->
  <!-- Ethernet ports -->
  <rect x="490" y="162" width="100" height="165" fill="#111520" rx="3"/>
  <rect x="490" y="162" width="100" height="165" fill="none" stroke="#1e2530" stroke-width="1" rx="3"/>

  <!-- ETH label -->
  <text x="510" y="178" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7" fill="#3a4a5a" letter-spacing="1">ETHERNET</text>

  <!-- Port 1 -->
  <rect x="497" y="183" width="38" height="26" fill="#0a0d14" rx="2"/>
  <rect x="497" y="183" width="38" height="26" fill="none" stroke="#1e2a38" stroke-width="1" rx="2"/>
  <rect x="502" y="193" width="28" height="2" fill="#1e2a38" rx="1"/>
  <rect x="502" y="197" width="28" height="2" fill="#1e2a38" rx="1"/>
  <circle cx="497" cy="183" r="2" fill="#00c8ff" opacity="0.7" filter="url(#glow)">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="540" y="200" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7" fill="#2a3a4a">ETH1</text>

  <!-- Port 2 -->
  <rect x="497" y="217" width="38" height="26" fill="#0a0d14" rx="2"/>
  <rect x="497" y="217" width="38" height="26" fill="none" stroke="#1e2a38" stroke-width="1" rx="2"/>
  <rect x="502" y="227" width="28" height="2" fill="#1e2a38" rx="1"/>
  <rect x="502" y="231" width="28" height="2" fill="#1e2a38" rx="1"/>
  <circle cx="497" cy="217" r="2" fill="#2a3040" opacity="0.5"/>
  <text x="540" y="234" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7" fill="#2a3a4a">ETH2</text>

  <!-- USB ports -->
  <text x="510" y="258" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7" fill="#3a4a5a" letter-spacing="1">USB / RS-485</text>
  <rect x="497" y="263" width="18" height="12" fill="#0a0d14" rx="1"/>
  <rect x="497" y="263" width="18" height="12" fill="none" stroke="#1e2a38" stroke-width="1" rx="1"/>
  <rect x="519" y="263" width="18" height="12" fill="#0a0d14" rx="1"/>
  <rect x="519" y="263" width="18" height="12" fill="none" stroke="#1e2a38" stroke-width="1" rx="1"/>
  <text x="497" y="290" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6.5" fill="#2a3a4a">NMEA  CAN  4G</text>

  <!-- Serial ports row -->
  <rect x="497" y="295" width="12" height="20" fill="#0a0d14" rx="1"/>
  <rect x="497" y="295" width="12" height="20" fill="none" stroke="#1e2a38" stroke-width="1"/>
  <rect x="513" y="295" width="12" height="20" fill="#0a0d14" rx="1"/>
  <rect x="513" y="295" width="12" height="20" fill="none" stroke="#1e2a38" stroke-width="1"/>
  <rect x="529" y="295" width="12" height="20" fill="#0a0d14" rx="1"/>
  <rect x="529" y="295" width="12" height="20" fill="none" stroke="#1e2a38" stroke-width="1"/>

  <!-- Model / serial text bottom of panel -->
  <text x="219" y="312" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7.5" fill="#2a3a4a" letter-spacing="0.5">MODEL: SL-DAB-2100</text>
  <text x="219" y="325" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7.5" fill="#2a3a4a" letter-spacing="0.5">IEC 60945  ·  IP54  ·  MADE IN INDIA</text>

  <!-- Bottom connector ports row -->
  <g transform="translate(200, 355)">
    <!-- Power connector -->
    <rect x="0" y="0" width="24" height="12" fill="#0e1118" rx="1"/>
    <rect x="0" y="0" width="24" height="12" fill="none" stroke="#252c3a" stroke-width="1" rx="1"/>
    <circle cx="8" cy="6" r="2" fill="#252c3a"/>
    <circle cx="16" cy="6" r="2" fill="#252c3a"/>
    <text x="2" y="-3" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6" fill="#2a3a4a">PWR</text>

    <rect x="32" y="0" width="24" height="12" fill="#0e1118" rx="1"/>
    <rect x="32" y="0" width="24" height="12" fill="none" stroke="#252c3a" stroke-width="1" rx="1"/>
    <rect x="35" y="4" width="18" height="4" fill="#1a2030" rx="0.5"/>
    <text x="32" y="-3" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6" fill="#2a3a4a">GNSS</text>

    <rect x="64" y="0" width="24" height="12" fill="#0e1118" rx="1"/>
    <rect x="64" y="0" width="24" height="12" fill="none" stroke="#252c3a" stroke-width="1" rx="1"/>
    <rect x="67" y="4" width="18" height="4" fill="#1a2030" rx="0.5"/>
    <text x="65" y="-3" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6" fill="#2a3a4a">AUX1</text>

    <rect x="96" y="0" width="24" height="12" fill="#0e1118" rx="1"/>
    <rect x="96" y="0" width="24" height="12" fill="none" stroke="#252c3a" stroke-width="1" rx="1"/>
    <rect x="99" y="4" width="18" height="4" fill="#1a2030" rx="0.5"/>
    <text x="97" y="-3" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6" fill="#2a3a4a">AUX2</text>

    <rect x="128" y="0" width="32" height="12" fill="#0e1118" rx="1"/>
    <rect x="128" y="0" width="32" height="12" fill="none" stroke="#252c3a" stroke-width="1" rx="1"/>
    <rect x="131" y="3" width="26" height="6" fill="#1a2030" rx="0.5"/>
    <text x="128" y="-3" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6" fill="#2a3a4a">RS-232</text>

    <rect x="168" y="0" width="32" height="12" fill="#0e1118" rx="1"/>
    <rect x="168" y="0" width="32" height="12" fill="none" stroke="#252c3a" stroke-width="1" rx="1"/>
    <rect x="171" y="3" width="26" height="6" fill="#1a2030" rx="0.5"/>
    <text x="171" y="-3" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6" fill="#2a3a4a">NMEA</text>

    <rect x="208" y="0" width="32" height="12" fill="#0e1118" rx="1"/>
    <rect x="208" y="0" width="32" height="12" fill="none" stroke="#252c3a" stroke-width="1" rx="1"/>
    <rect x="211" y="3" width="26" height="6" fill="#1a2030" rx="0.5"/>
    <text x="212" y="-3" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6" fill="#2a3a4a">CAN BUS</text>
  </g>

  <!-- Top mounting screws -->
  <circle cx="196" cy="144" r="4" fill="#1a2030" stroke="#252c3a" stroke-width="1"/>
  <line x1="194" y1="144" x2="198" y2="144" stroke="#2a3a4a" stroke-width="1"/>
  <line x1="196" y1="142" x2="196" y2="146" stroke="#2a3a4a" stroke-width="1"/>

  <circle cx="600" cy="144" r="4" fill="#1a2030" stroke="#252c3a" stroke-width="1"/>
  <line x1="598" y1="144" x2="602" y2="144" stroke="#2a3a4a" stroke-width="1"/>
  <line x1="600" y1="142" x2="600" y2="146" stroke="#2a3a4a" stroke-width="1"/>

  <!-- Bottom screws -->
  <circle cx="196" cy="346" r="4" fill="#1a2030" stroke="#252c3a" stroke-width="1"/>
  <line x1="194" y1="346" x2="198" y2="346" stroke="#2a3a4a" stroke-width="1"/>
  <line x1="196" y1="344" x2="196" y2="348" stroke="#2a3a4a" stroke-width="1"/>

  <circle cx="600" cy="346" r="4" fill="#1a2030" stroke="#252c3a" stroke-width="1"/>
  <line x1="598" y1="346" x2="602" y2="346" stroke="#2a3a4a" stroke-width="1"/>
  <line x1="600" y1="344" x2="600" y2="348" stroke="#2a3a4a" stroke-width="1"/>

  <!-- Caption below -->
  <text x="400" y="420" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#3a4a5a" letter-spacing="2">SEALINK ELECTRICAL  ·  DATA ACQUISITION BOX  ·  SL-DAB-2100</text>
  <line x1="200" y1="430" x2="600" y2="430" stroke="#1e2530" stroke-width="1"/>
</svg>
